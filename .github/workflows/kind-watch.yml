name: KIND Disclosure Watch

# KIND 분배금 공시를 수집·반영하고, 일정 달력과 뉴스레터를 자동 처리한다.
#
# [watch 잡] 공시 수집 → 프로세서 → kind_verify.py 검증 → 통과해야만 push (= 사이트 반영)
#            검증 실패 시 반영하지 않고 경고 이슈만 남긴다.
# [auto 잡]  2026-10-12부터 사용자 결정으로 자동화 (그 전에는 매번 사람이 요청했다)
#   · auto_schedule.py        최종매수일 하루 전(영업일) 달력 반영 → 반영되면 일정 뉴스레터 발송
#   · auto_data_newsletter.py 이번 달 회차 데이터가 반영돼 있으면 데이터 뉴스레터 발송
#   두 스크립트 모두 관문(공시 실측 대조, 분배율 재계산, 원시 종가 일관성 등)에 걸리면
#   보내지 않고 이슈로 알린다. 회차당 한 번만 나간다(archive.json 기준).
#   auto 잡은 저장소를 새로 체크아웃해서 돈다 — watch 잡에서 검증에 실패해 push되지 않은
#   데이터가 작업 폴더에 남아 있어도 그걸 읽어 발송하는 일이 없도록.
#
# 하지 않는 일
#   - 인사이트 글 작성: 사람이 요청할 때 Claude가 쓴다
#
# 알림 규칙: 열린 이슈 = 사람이 확인할 일. 정상 처리는 이슈를 만들고 바로 닫는다(기록용).
#            새 보류 이슈가 생기면 실행도 실패로 끝내 Actions 실패 알림으로도 전달되게 한다.

on:
  schedule:
    # 18:30 KST 평일 — 분배금 공시는 오후에 걸쳐 올라오므로 장 마감 후에 확인
    - cron: '30 9 * * 1-5'
    # 20:30 KST 평일 — GitHub 예약 실행이 통째로 건너뛰어지는 일이 있어(2026-08-27) 재시도
    - cron: '30 11 * * 1-5'
    # 08:00 KST 평일(UTC로는 전날 일~목) — 일정 반영·뉴스레터의 기본 시각이자 전날 누락분 재시도
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    inputs:
      force_process:
        description: '새 공시가 없어도 프로세서·검증을 실행 (동작 점검·수동 재처리용)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# 실행이 겹치면 push가 서로 엇갈리므로 한 번에 하나씩
concurrency:
  group: kind-watch
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1
  # 날짜 판단(이번 달 회차인지, 뉴스레터의 월 표기, 아카이브 id)을 한국 시간으로 한다.
  # 08:00 KST 실행은 UTC로 전날이라, 없으면 월초에 월 표기가 틀어진다.
  TZ: Asia/Seoul

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests xlrd holidays
          playwright install --with-deps chromium

      - name: Collect distribution disclosures
        id: fetch
        continue-on-error: true      # 실패해도 아래 알림 단계까지는 가야 조용히 묻히지 않는다
        run: |
          set -o pipefail
          python -X utf8 kind_fetch.py 2>&1 | tee fetch.log
          # 새로 저장된 파일이 있는지 (working tree 기준)
          if [ -n "$(git status --porcelain data/raw)" ]; then
            echo "new_files=true" >> $GITHUB_OUTPUT
          else
            echo "new_files=false" >> $GITHUB_OUTPUT
          fi

      # 수집 자체가 깨지면(KIND 장애·화면 변경 등) 새 공시가 있어도 못 가져온다.
      # 월말·월중 공시일에 이런 일이 겹치면 회차를 통째로 놓치므로 따로 알린다.
      - name: Open fetch failure issue
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 KIND 공시 수집 실패 ($(date +%m/%d))"
          # 연속 실패 시 매일 새 이슈가 쌓이지 않도록 열린 이슈가 있으면 건너뛴다
          if gh issue list --state open --limit 50 --json title --jq '.[].title' \
             | grep -qF "KIND 공시 수집 실패"; then
            echo "이미 열린 수집 실패 이슈가 있습니다."
            exit 0
          fi
          {
            echo "\`kind_fetch.py\` 가 실패해 **새 공시를 확인하지 못했습니다.**"
            echo ""
            echo "사이트 데이터는 이전 상태 그대로이고 잘못된 값이 반영되지는 않았습니다."
            echo "다만 이 상태가 이어지면 **분배금 공시일에 회차를 통째로 놓칩니다.**"
            echo ""
            echo "### 할 일"
            echo "- [ ] 공시일이 임박했는지 확인 (기준일 2일 전쯤 공시가 올라옵니다)"
            echo "- [ ] Claude에게 \`\"KIND 수집 실패 확인해줘\"\` 라고 요청"
            echo ""
            echo "> 일시적 장애면 다음 실행에 자동 복구됩니다 (하루 세 번 실행, 페이지 열기는 3회 재시도)."
            echo "> 반복되면 KIND 화면 구조가 바뀐 것일 수 있습니다 — 아래 로그의 \`input_ids\` 를 확인하세요."
            echo ""
            echo "## 수집 로그"
            echo '```'
            tail -60 fetch.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } > fetch_fail.md
          gh issue create --title "$TITLE" --body-file fetch_fail.md

      # 보고용 — 달력 반영은 auto 잡의 auto_schedule.py 가 한다
      - name: Check upcoming schedule
        id: schedule
        continue-on-error: true
        run: |
          set -o pipefail
          python -X utf8 kind_schedule.py 2>&1 | tee schedule.log

      # 신규 상장 ETF의 첫 분배를 반영할 때, 프로세서 기본 경로는 메타 캐시를 읽기만 한다.
      # 캐시를 채우는 건 매일 종가 워크플로(--prices-only)뿐이라 그대로 두면
      # 상장일·기초지수·상품설명이 하루쯤 빈 채로 노출된다. 프로세서 전에 미리 채운다.
      - name: Fill meta for new listings
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        continue-on-error: true      # 메타는 다음 날 종가 워크플로가 재시도하므로 실패해도 진행
        run: |
          set -o pipefail
          python -X utf8 kind_meta.py 2>&1 | tee meta.log

      - name: Run processor
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        run: |
          set -o pipefail
          python -X utf8 etf_data_processor.py 2>&1 | tail -40 | tee process.log

      - name: Verify data
        id: verify
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        continue-on-error: true      # 실패해도 워크플로를 멈추지 않고 경고 이슈를 남긴다
        run: |
          set -o pipefail
          python -X utf8 kind_verify.py 2>&1 | tee verify.log

      - name: Commit and push
        id: push
        if: (steps.fetch.outputs.new_files == 'true' || inputs.force_process) && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/output/latest.json data/output/history.json \
                  data/output/etf_data.js data/output/etf_meta.json index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: KIND 분배금 자동 수집·반영 $(date +%Y-%m-%d)"
          # 리베이스 충돌 시 --theirs = 이번 실행이 만든 최신 데이터
          # (리베이스 중에는 ours/theirs 의미가 뒤집힌다 — CLAUDE.md 참조)
          if ! git pull --rebase origin master; then
            git checkout --theirs data/raw data/output/latest.json data/output/history.json \
                                  data/output/etf_data.js index.html
            git add data/raw data/output/latest.json data/output/history.json \
                    data/output/etf_data.js index.html
            GIT_EDITOR=true git rebase --continue
          fi
          git push

      # 반영 성공 시의 알림은 auto 잡의 뉴스레터 결과 이슈가 대신한다.
      - name: Open verify failure issue
        if: steps.fetch.outputs.new_files == 'true' && steps.verify.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "새 분배금 공시를 수집했지만 **검증에 실패해 사이트에 반영하지 않았습니다.**"
            echo "데이터 뉴스레터도 나가지 않습니다."
            echo ""
            echo "원본 XLS도 커밋하지 않았습니다. 아래 검증 결과를 확인하고,"
            echo "Claude에게 \`\"분배금 검증 실패 확인해줘\"\` 라고 요청하세요."
            echo ""
            echo "## 검증 결과"
            echo '```'
            cat verify.log 2>/dev/null || echo "(검증 로그 없음)"
            echo '```'
            echo ""
            echo "## 수집 결과"
            echo '```'
            cat fetch.log
            echo '```'
          } > issue_body.md
          gh issue create --title "⚠️ 분배금 검증 실패 — 사이트 미반영 ($(date +%m/%d))" --body-file issue_body.md

      - name: Summary
        if: always()
        run: |
          {
            echo "## KIND 감시 결과"
            echo ""
            if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
              echo "🚨 공시 수집 실패 — 새 공시를 확인하지 못했습니다. 이슈를 확인하세요."
            elif [ "${{ steps.fetch.outputs.new_files }}" != "true" ]; then
              echo "변경 없음 — 새로 올라온 공시가 없습니다."
            elif [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "✅ 새 공시 수집 → 검증 통과 → 사이트 반영 완료. 뉴스레터는 auto 잡이 처리."
            else
              echo "⚠️ 새 공시 수집했으나 검증 실패 → 사이트 미반영. 이슈를 확인하세요."
            fi
            echo ""
            echo '```'
            cat verify.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat fetch.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat schedule.log 2>/dev/null || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # fetch 단계는 알림 이슈를 만들기 위해 continue-on-error 로 두었으므로,
      # 여기서 다시 실패로 끝내야 실행 결과가 '성공'으로 잘못 표시되지 않는다.
      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "kind_fetch.py 실패 — 위 로그와 생성된 이슈를 확인하세요."
          exit 1

  auto:
    needs: watch
    if: always()                     # 수집이 실패해도 일정 반영·발송 판단은 따로 돈다
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master                # watch 잡이 방금 push한 데이터까지 포함한 최신본
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests holidays playwright xlrd
          playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Schedule — calendar + schedule newsletter
        id: sched
        continue-on-error: true
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: |
          set -o pipefail
          python -X utf8 auto_schedule.py --live 2>&1 | tee auto_schedule.log

      - name: Data newsletter
        id: data
        continue-on-error: true
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: |
          set -o pipefail
          python -X utf8 auto_data_newsletter.py --live 2>&1 | tee auto_data_newsletter.log

      - name: Report as issues
        id: issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_HELD=0
          report() {
            NAME=$1; OUTCOME=$2; STATUS=$3
            if [ -z "$STATUS" ] && [ "$OUTCOME" != "success" ]; then
              # 스크립트가 상태를 남기기 전에 죽었다
              STATUS=held
              TITLE="⚙️ 자동 처리 오류 — $NAME ($(date +%m/%d))"
              {
                echo "자동 처리 스크립트가 예기치 않게 종료됐습니다."
                echo "이번 실행에서 아무것도 보내지 않았거나 일부만 처리됐을 수 있습니다."
                echo ""
                echo '```'
                tail -60 "$NAME.log" 2>/dev/null || echo "(로그 없음)"
                echo '```'
              } > body.md
            else
              TITLE=$(cat "${NAME}_title.txt" 2>/dev/null)
              {
                cat "${NAME}_report.md" 2>/dev/null
                echo ""
                echo "<details><summary>실행 로그</summary>"
                echo ""
                echo '```'
                tail -80 "$NAME.log" 2>/dev/null
                echo '```'
                echo "</details>"
              } > body.md
            fi
            [ -z "$TITLE" ] && return 0
            case "$STATUS" in
              held)
                # 같은 문제로 열린 이슈가 있으면 다시 만들지 않는다 (제목에 회차 키가 들어 있다)
                if gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -qxF "$TITLE"; then
                  echo "이미 열린 이슈: $TITLE"
                else
                  gh issue create --title "$TITLE" --body-file body.md
                  NEW_HELD=1
                fi ;;
              done)
                URL=$(gh issue create --title "$TITLE" --body-file body.md)
                gh issue close "$URL" --comment "자동 처리 완료 — 기록용으로 남기고 닫습니다." ;;
            esac
          }
          report auto_schedule        "${{ steps.sched.outcome }}" "${{ steps.sched.outputs.status }}"
          report auto_data_newsletter "${{ steps.data.outcome }}"  "${{ steps.data.outputs.status }}"
          echo "new_held=$NEW_HELD" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          {
            echo "## 자동 처리 결과"
            echo ""
            echo "- 일정: ${{ steps.sched.outputs.status || '오류' }}"
            echo "- 데이터 뉴스레터: ${{ steps.data.outputs.status || '오류' }}"
            echo ""
            echo '```'
            cat auto_schedule.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat auto_data_newsletter.log 2>/dev/null || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # 새로 생긴 보류는 실행도 실패로 끝내, 이슈 알림 외에 Actions 실패 알림으로도 전달되게 한다
      - name: Fail on new hold
        if: steps.issues.outputs.new_held == '1'
        run: |
          echo "사람이 확인할 일이 생겼습니다 — 열린 이슈를 확인하세요."
          exit 1
