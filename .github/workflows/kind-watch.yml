name: KIND Disclosure Watch

# KIND에 새 분배금 공시가 올라왔는지 평일 저녁에 확인한다.
#
# 하는 일
#   1. 공시 수집 → data/raw
#   2. 새 공시가 있으면 프로세서 실행 → latest.json / etf_data.js / index.html 갱신
#   3. kind_verify.py 로 검증. 통과해야만 커밋·push (= 사이트 반영)
#   4. 다가오는 일정 파악 (계산해서 보여주기만 함 — 달력 반영은 사람이 확인 후)
#   5. 이슈로 결과 알림 — 두 가지가 독립적으로 나간다
#        · 분배금 반영 알림: 새 공시를 수집했을 때
#        · 분배 일정 알림:   달력에 없는 정규 회차를 발견했을 때 (회차당 한 번)
#
# 하지 않는 일
#   - 뉴스레터 발송: 되돌릴 수 없고 구독자에게 바로 나가므로 항상 사용자 승인 후 수동 발송
#   - 달력(CONFIRMED_SCHEDULE) 수정: 미래 날짜는 공휴일을 반영할 수 없어 사람이 확인
#
# 검증 실패 시에는 사이트에 반영하지 않고 경고 이슈만 남긴다.

on:
  schedule:
    # 09:30 UTC = 18:30 KST, 평일. 분배금 공시는 오후에 걸쳐 올라오므로 장 마감 후에 확인.
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_process:
        description: '새 공시가 없어도 프로세서·검증을 실행 (동작 점검·수동 재처리용)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests xlrd
          playwright install --with-deps chromium

      - name: Collect distribution disclosures
        id: fetch
        continue-on-error: true      # 실패해도 아래 알림 단계까지는 가야 조용히 묻히지 않는다
        run: |
          set -o pipefail
          python -X utf8 kind_fetch.py 2>&1 | tee fetch.log
          # 새로 저장된 파일이 있는지 (working tree 기준)
          if [ -n "$(git status --porcelain data/raw)" ]; then
            echo "new_files=true" >> $GITHUB_OUTPUT
          else
            echo "new_files=false" >> $GITHUB_OUTPUT
          fi

      # 수집 자체가 깨지면(KIND 장애·화면 변경 등) 새 공시가 있어도 못 가져온다.
      # 아래 '분배금 반영 알림'은 new_files=true 일 때만 나가므로 이 경우 조용히 묻힌다.
      # 월말·월중 공시일에 이런 일이 겹치면 회차를 통째로 놓치므로 따로 알린다.
      - name: Open fetch failure issue
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 KIND 공시 수집 실패 ($(TZ=Asia/Seoul date +%m/%d))"
          # 연속 실패 시 매일 새 이슈가 쌓이지 않도록 열린 이슈가 있으면 건너뛴다
          if gh issue list --state open --limit 50 --json title --jq '.[].title' \
             | grep -qF "KIND 공시 수집 실패"; then
            echo "이미 열린 수집 실패 이슈가 있습니다."
            exit 0
          fi
          {
            echo "\`kind_fetch.py\` 가 실패해 **새 공시를 확인하지 못했습니다.**"
            echo ""
            echo "사이트 데이터는 이전 상태 그대로이고 잘못된 값이 반영되지는 않았습니다."
            echo "다만 이 상태가 이어지면 **분배금 공시일에 회차를 통째로 놓칩니다.**"
            echo ""
            echo "### 할 일"
            echo "- [ ] 공시일이 임박했는지 확인 (기준일 2일 전쯤 공시가 올라옵니다)"
            echo "- [ ] Claude에게 \`\"KIND 수집 실패 확인해줘\"\` 라고 요청"
            echo ""
            echo "> 일시적 장애면 다음 실행에 자동 복구됩니다 (페이지 열기는 3회 재시도)."
            echo "> 반복되면 KIND 화면 구조가 바뀐 것일 수 있습니다 — 아래 로그의 \`input_ids\` 를 확인하세요."
            echo ""
            echo "## 수집 로그"
            echo '```'
            tail -60 fetch.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } > fetch_fail.md
          gh issue create --title "$TITLE" --body-file fetch_fail.md

      - name: Check upcoming schedule
        id: schedule
        continue-on-error: true
        run: |
          set -o pipefail
          python -X utf8 kind_schedule.py 2>&1 | tee schedule.log
          # 스크립트가 달력(CONFIRMED_SCHEDULE)과 대조해 미반영 회차를 알려준다.
          if grep -q '^PENDING_SCHEDULE=1' schedule.log; then
            echo "pending=true" >> $GITHUB_OUTPUT
            # 중복 알림 방지 키 = 미반영 회차의 기준일. 회차가 바뀌어야 새 이슈가 나간다.
            KEY=$(grep '^PENDING_ROUND=' schedule.log \
                  | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' '_' | sed 's/_$//')
            echo "key=$KEY" >> $GITHUB_OUTPUT
          else
            echo "pending=false" >> $GITHUB_OUTPUT
          fi

      # 신규 상장 ETF의 첫 분배를 반영할 때, 프로세서 기본 경로는 메타 캐시를 읽기만 한다.
      # 캐시를 채우는 건 매일 종가 워크플로(--prices-only)뿐이라 그대로 두면
      # 상장일·기초지수·상품설명이 하루쯤 빈 채로 노출된다. 프로세서 전에 미리 채운다.
      - name: Fill meta for new listings
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        continue-on-error: true      # 메타는 다음 날 종가 워크플로가 재시도하므로 실패해도 진행
        run: |
          set -o pipefail
          python -X utf8 kind_meta.py 2>&1 | tee meta.log

      - name: Run processor
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        run: |
          set -o pipefail
          python -X utf8 etf_data_processor.py 2>&1 | tail -40 | tee process.log

      - name: Verify data
        id: verify
        if: steps.fetch.outputs.new_files == 'true' || inputs.force_process
        continue-on-error: true      # 실패해도 워크플로를 멈추지 않고 경고 이슈를 남긴다
        run: |
          set -o pipefail
          python -X utf8 kind_verify.py 2>&1 | tee verify.log

      - name: Commit and push
        id: push
        if: (steps.fetch.outputs.new_files == 'true' || inputs.force_process) && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/output/latest.json data/output/history.json \
                  data/output/etf_data.js data/output/etf_meta.json index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: KIND 분배금 자동 수집·반영 $(date -u +%Y-%m-%d)"
          # 리베이스 충돌 시 --theirs = 이번 실행이 만든 최신 데이터
          # (리베이스 중에는 ours/theirs 의미가 뒤집힌다 — CLAUDE.md 참조)
          if ! git pull --rebase origin master; then
            git checkout --theirs data/raw data/output/latest.json data/output/history.json \
                                  data/output/etf_data.js index.html
            git add data/raw data/output/latest.json data/output/history.json \
                    data/output/etf_data.js index.html
            GIT_EDITOR=true git rebase --continue
          fi
          git push

      - name: Open notification issue
        if: steps.fetch.outputs.new_files == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OK="${{ steps.verify.outcome }}"
          if [ "$OK" = "success" ]; then
            TITLE="✅ 분배금 반영됨 — 뉴스레터 발송 대기 ($(TZ=Asia/Seoul date +%m/%d))"
          else
            TITLE="⚠️ 분배금 검증 실패 — 사이트 미반영 ($(TZ=Asia/Seoul date +%m/%d))"
          fi

          {
            if [ "$OK" = "success" ]; then
              echo "새 분배금 공시를 수집해 **사이트에 반영했습니다.**"
              echo ""
              echo "### 남은 일"
              echo "- [ ] **뉴스레터 발송** — 자동 발송되지 않습니다. Claude에게 \`\"데이터 뉴스레터 보내줘\"\` 라고 요청하세요."
              echo "- [ ] 달력 일정 반영이 필요하면 \`\"분배 일정 반영해줘\"\` (아래 '다가오는 일정' 참고)"
            else
              echo "새 분배금 공시를 수집했지만 **검증에 실패해 사이트에 반영하지 않았습니다.**"
              echo ""
              echo "원본 XLS도 커밋하지 않았습니다. 아래 검증 결과를 확인하고,"
              echo "Claude에게 \`\"분배금 검증 실패 확인해줘\"\` 라고 요청하세요."
            fi
            echo ""
            echo "## 검증 결과"
            echo '```'
            cat verify.log 2>/dev/null || echo "(검증 로그 없음)"
            echo '```'
            echo ""
            echo "## 수집 결과"
            echo '```'
            cat fetch.log
            echo '```'
            echo ""
            echo "## 다가오는 일정 (달력 반영은 수동)"
            echo '```'
            cat schedule.log 2>/dev/null || echo "(일정 확인 실패 — kind_schedule.py 수동 실행 필요)"
            echo '```'
          } > issue_body.md

          gh issue create --title "$TITLE" --body-file issue_body.md

      # 일정 알림은 분배금 공시와 무관하게 나간다.
      # 일정 공시(설정/환매 안내)는 최종매수일 5~9일 전에 먼저 올라오는데,
      # 그때는 새 분배금 공시가 없어 위 알림 조건(new_files)에 안 걸린다.
      # 그래서 일정을 멀쩡히 계산해 놓고도 아무도 모르는 구간이 있었다.
      - name: Open schedule issue
        if: steps.schedule.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="[sched-${{ steps.schedule.outputs.key }}]"
          # 달력에 반영하기 전까지는 매일 pending이므로, 같은 회차로 두 번 알리지 않는다.
          if gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -qF "$MARKER"; then
            echo "이미 알림한 회차입니다: $MARKER"
            exit 0
          fi
          {
            echo "KIND 공시에서 새 분배 일정이 확인됐습니다. **달력에 아직 반영되지 않았습니다.**"
            echo ""
            echo "### 할 일"
            echo "- [ ] Claude에게 \`\"분배 일정 반영해줘\"\` 요청 (index.html CONFIRMED_SCHEDULE)"
            echo ""
            echo "일정 뉴스레터는 늘 그렇듯 승인 후 수동 발송입니다."
            echo ""
            echo "> 최종매수일은 공시 원문의 중지기간 종료일(실측)이고,"
            echo "> 배당락일·기준일은 주말만 반영한 계산값입니다."
            echo "> 종목수는 지금까지 공시한 운용사 기준이라 앞으로 늘어납니다 — 날짜는 확정값입니다."
            echo ""
            echo "## 일정 확인 결과"
            echo '```'
            cat schedule.log
            echo '```'
          } > schedule_issue.md
          gh issue create --title "📅 분배 일정 확인 — 달력 미반영 $MARKER" --body-file schedule_issue.md

      - name: Summary
        if: always()
        run: |
          {
            echo "## KIND 감시 결과"
            echo ""
            if [ "${{ steps.schedule.outputs.pending }}" = "true" ]; then
              echo "📅 달력 미반영 회차 있음 (기준일 ${{ steps.schedule.outputs.key }})"
              echo ""
            fi
            if [ "${{ steps.fetch.outcome }}" = "failure" ]; then
              echo "🚨 공시 수집 실패 — 새 공시를 확인하지 못했습니다. 이슈를 확인하세요."
            elif [ "${{ steps.fetch.outputs.new_files }}" != "true" ]; then
              echo "변경 없음 — 새로 올라온 공시가 없습니다."
            elif [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "✅ 새 공시 수집 → 검증 통과 → 사이트 반영 완료. 뉴스레터는 수동 발송."
            else
              echo "⚠️ 새 공시 수집했으나 검증 실패 → 사이트 미반영. 이슈를 확인하세요."
            fi
            echo ""
            echo '```'
            cat verify.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat fetch.log 2>/dev/null || true
            echo '```'
            echo '```'
            cat schedule.log 2>/dev/null || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # fetch 단계는 알림 이슈를 만들기 위해 continue-on-error 로 두었으므로,
      # 여기서 다시 실패로 끝내야 실행 결과가 '성공'으로 잘못 표시되지 않는다.
      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "kind_fetch.py 실패 — 위 로그와 생성된 이슈를 확인하세요."
          exit 1
