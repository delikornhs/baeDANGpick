name: Daily Price Update

on:
  schedule:
    # 08:30 UTC = 17:30 KST, 평일만 실행 (한국 장 마감 후)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests xlrd Pillow

      - name: Install Korean font
        run: sudo apt-get install -y fonts-nanum 2>/dev/null || true

      - name: Fetch ETF meta (Monday or manual trigger)
        run: |
          DOW=$(date -u +%u)
          EVENT="${{ github.event_name }}"
          if [ "$DOW" = "1" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "메타 데이터 갱신 (DOW=$DOW, event=$EVENT)"
            python etf_data_processor.py --fetch-meta
          else
            echo "평일(월 제외) — 메타 스킵"
          fi

      - name: Fetch latest prices
        run: python etf_data_processor.py --prices-only

      - name: Update sitemap lastmod
        run: |
          python - <<'EOF'
          import re
          from datetime import datetime, timezone, timedelta

          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).strftime('%Y-%m-%d')

          with open('sitemap.xml', encoding='utf-8') as f:
              content = f.read()

          # 매일 갱신되는 페이지: 메인, 랭킹, ETF 상세(weekly/monthly 모두)
          # priority 0.8 이상 + changefreq daily/weekly 페이지만 오늘 날짜로 갱신
          def replace_lastmod(block):
              loc = re.search(r'<loc>(.*?)</loc>', block)
              if not loc:
                  return block
              url = loc.group(1)
              # 인사이트 글(고정 날짜), 가이드(yearly) 제외
              if '/insight/posts/' in url or 'guide-0' in url:
                  return block
              return re.sub(r'<lastmod>\d{4}-\d{2}-\d{2}</lastmod>',
                            f'<lastmod>{today}</lastmod>', block)

          parts = re.split(r'(?=<url>)', content)
          content = ''.join(replace_lastmod(p) for p in parts)

          with open('sitemap.xml', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'sitemap lastmod 갱신 완료: {today}')
          EOF

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/output/latest.json data/output/etf_data.js index.html
          git add data/output/etf_meta.json sitemap.xml data/output/price_history 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음, 스킵"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "dist_changed=false" >> $GITHUB_OUTPUT
          else
            # 커밋 전 해시 저장 (분배금 필드 변경 여부 비교용)
            OLD_HASH=$(git rev-parse HEAD)
            git commit -m "chore: daily price update $(date -u +%Y-%m-%d)"
            # rebase 충돌 시 데이터 파일은 워크플로우(최신 가격) 버전 우선
            # ⚠️ 리베이스 도중 --ours = origin/master(구버전), --theirs = 내가 만든 새 데이터 (git 관례상 반대로 뒤집힘)
            if ! git pull --rebase origin master; then
              git checkout --theirs data/output/latest.json data/output/etf_data.js data/output/etf_meta.json index.html data/output/price_history
              git add data/output/latest.json data/output/etf_data.js data/output/etf_meta.json index.html data/output/price_history
              GIT_EDITOR=true git rebase --continue
            fi
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
            # 분배금 공시 고유 필드(dist·ex_date·pay_date·notice_date·timing)만 변경됐는지 확인
            # price·rate는 가격 업데이트 시 매일 바뀌므로 제외
            if git diff "$OLD_HASH" HEAD -- data/output/latest.json \
               | grep -E '^\+[^+].*"(dist|ex_date|pay_date|notice_date|timing)"' \
               | grep -qv '"timing": ""'; then
              echo "dist_changed=true" >> $GITHUB_OUTPUT
              echo "분배금 공시 데이터 변경 감지 → Threads 포스트 생성"
            else
              echo "dist_changed=false" >> $GITHUB_OUTPUT
              echo "가격만 변경됨 → Threads 포스트 스킵"
            fi
          fi

      # ⚠️ 데이터 뉴스레터 자동 발송은 2026-07-26에 제거했다.
      #   발송은 되돌릴 수 없고 구독자에게 바로 나가므로, 데이터를 눈으로 확인한 뒤
      #   사용자 승인을 받아 보낸다. 발송 절차는 CLAUDE.md '분배금 데이터 업데이트' 5단계 참조
      #   (send-data-newsletter.yml 워크플로를 수동 트리거).
      #   과거 사례: 2026-06-26 latest.json이 늦게 커밋되어 이전 달 데이터가 발송됨.

      - name: Generate Threads post (분배금 공시 데이터 변경 시에만)
        if: steps.commit.outputs.dist_changed == 'true'
        run: python generate_post.py

      - name: Commit generated post files
        if: steps.commit.outputs.dist_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "포스트 파일 변경 없음"
          else
            git commit -m "chore: auto-generate threads post $(date -u +%Y-%m-%d)"
            if ! git pull --rebase origin master; then
              git checkout --theirs posts/
              git add posts/
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi
