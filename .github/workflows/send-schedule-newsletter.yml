name: Send Schedule Newsletter

on:
  workflow_dispatch:
    inputs:
      timing:
        description: '월중 또는 월말'
        required: true
        type: choice
        options:
          - 월중
          - 월말
      last_buy:
        description: '최종매수일 (YYYY-MM-DD)'
        required: true
        type: string
      ex_date:
        description: '배당락일 (YYYY-MM-DD)'
        required: true
        type: string
      record:
        description: '기준일 (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1
  # 뉴스레터의 월 표기와 아카이브 id를 한국 날짜로 만든다
  TZ: Asia/Seoul

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send schedule newsletter
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
        run: |
          python trigger_newsletter.py \
            --type schedule \
            --timing "${{ inputs.timing }}" \
            --last-buy "${{ inputs.last_buy }}" \
            --ex-date "${{ inputs.ex_date }}" \
            --record "${{ inputs.record }}"

      # 발송 결과가 '불명'(종료 코드 2)이어도 기록은 남겨야 하므로 항상 실행한다.
      # 기록이 커밋되지 않으면 자동 발송(kind-watch.yml)이 이 회차를 안 보낸 것으로 보고 다시 보낼 수 있다.
      # 충돌 시 예전처럼 --ours(리베이스 중엔 원격 쪽)로 풀면 방금 보낸 기록이 버려지므로,
      # 원격 최신본에 새 기록을 합쳐 다시 push한다.
      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python -X utf8 auto_common.py commit-archive "chore: newsletter archive update (schedule/${{ inputs.timing }})"
